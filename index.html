<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel - Spider-Man</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <div class="container">
        
        <!-- Capas de fondo -->
        <div class="bg-watermark">MARVEL</div>
        <div class="bg-city"></div>
        <div class="bg-red"></div>
        
        <!-- Contenido de texto (Izquierda) -->
        <div class="content">
            <div class="logo">MARVEL</div>
            <h1 class="title">SPIDER-MAN</h1>
            <p class="desc">
                Es un héroe que combate el crimen en el universo Marvel. Peter Parker obtuvo sus poderes tras ser picado por una araña radiactiva y sigue el lema: "Un gran poder conlleva una gran responsabilidad".
            </p>
            
            <div class="socials">
                <span>f</span> 
                <span>ig</span> 
                <span>x</span> 
                <span>yt</span>
            </div>
        </div>

        <!-- Imagen del personaje -->
        <!-- Recuerda colocar tu imagen PNG sin fondo en la ruta correcta -->
        <img src="assets/hola-Photoroom.png" alt="Spider-Man" class="hero-image">

        <!-- Indicadores de paginación (Derecha) -->
        <div class="indicators">
            <div class="line active"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

    </div>

</body>
</html>
